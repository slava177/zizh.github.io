# Site settings. Jekyll reads this file only when it starts, so restart `jekyll serve`
# after changing it.

locale                   : "en-US"
title                    : "Ziyi Zhang's Homepage"
title_separator          : "-"
description              : "ECE PhD at Carnegie Mellon University"   # for search engines, unless a page has its own excerpt
url                      : https://ziyi-zhang.com
baseurl                  : ""   # the subpath of the site, e.g. "/blog"
repository               : "slava177/zizh.github.io"

# The column at the left of the home, CV and paper pages (_includes/profile.html).
# Links left blank don't show.
author:
  avatar           : "profile_photo.jpg"   # in images/
  name             : "Ziyi Zhang"
  position         : "PhD Student"
  employer         : "Carnegie Mellon University"
  email            : "ziyizhan@andrew.cmu.edu"
  googlescholar    : "https://scholar.google.com/citations?user=w4qggFUAAAAJ"
  orcid            : "https://orcid.org/0000-0001-6173-4524"

# The faded photo behind the home, CV and paper pages, in images/; blank for none
backdrop                 : "models/2024-07-28-mary-rose.jpg"

# The kinds of papers, in the order the home and CV pages list them, with their headings.
# A paper's category: (in _publications/) is one of these.
publication_category:
  conferences:
    title: 'Conference Papers'
  manuscripts:
    title: 'Journal Articles'
  preprints:
    title: 'Preprints'

future                   : true   # list papers dated in the future
og_image                 : profile_photo.jpg   # the picture when a page is shared on social media, in images/; paper pages use their cover
google_site_verification :

# Analytics
analytics:
  provider               : false # false (default), "google", "google-universal", "google-analytics-4", "custom"
  google:
    tracking_id          :


# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - markdown_generator
  - node_modules
  - package.json*
  - photography      # originals of the Travel page's photos and clips; the site uses images/travel/
  - scaled_models    # originals of the Scale Models page's; the site uses images/models/
  - scripts
  - Rakefile
  - README
  - README.md
  - docker-compose.yaml
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# One file per paper in _publications/, each with its own page at /publication/...
collections:
  publications:
    output: true
    permalink: /:collection/:path/


# Pages get the column at the left (_layouts/profile.html) unless they say otherwise, as
# the Travel and Scale Models pages do; papers get _layouts/paper.html.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: profile
  - scope:
      path: ""
      type: publications
    values:
      layout: paper


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # https://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
timezone: America/New_York # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Mimic GitHub Pages with --safe
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji


# HTML Compression
# - https://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
