{% comment %} Courses from _data/cv.yml, with the year at the left. {% endcomment %}

<ul class="timeline">
  {% for course in site.data.cv.teaching %}
    <li>
      <span class="timeline__when">{{ course.when }}</span>
      <div class="timeline__what"><strong>{{ course.course }}</strong>{% if course.role %}, {{ course.role }}{% endif %}</div>
    </li>
  {% endfor %}
</ul>
