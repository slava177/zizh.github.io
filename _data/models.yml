# The Scale Models page (_pages/models.md), oldest first. The fields are the same as in
# _data/travel.yml, with the files in images/models/ (originals in scaled_models/) and
# the subtitle saying what the model is, plus
#
#   specs        optional details about the model, such as its scale and kit, shown as
#                a list in the full view

- file: 2018-04-16-kuri
  title: Kuri
  subtitle: Japanese destroyer
  date: 2018
  description: A Momi-class destroyer of the Imperial Japanese Navy, built in 1920, with her crew on deck and signal flags flying.

- file: 2018-05-09-suzuya
  title: Suzuya
  subtitle: Japanese heavy cruiser
  date: 2018
  description: A Mogami-class heavy cruiser of the Imperial Japanese Navy, moored to a buoy with her boats alongside. She was sunk off Samar in October 1944.

- file: 2019-08-14-port-of-fuzhou-1884
  title: Port of Fuzhou, 1884
  subtitle: Diorama, Sino-French War
  date: 2019
  description: Ships of China's Fujian Fleet in the Min River, and one on the slipway of the navy yard. In August 1884 a French squadron destroyed the fleet here, in the Battle of Fuzhou.

- file: 2023-03-08-hms-salamander
  title: HMS Salamander (1687)
  subtitle: Royal Navy bomb vessel, in wood
  date: 2023
  description: The hull is built in two parts, upper and lower, set apart to show the decks and the hold with its cargo.

- file: 2023-03-26-chinese-pavilion
  title: Chinese Pavilion
  subtitle: Wooden architecture model
  date: 2023
  description: A two-story pavilion with sweeping eaves, still on the workbench.

- file: 2024-07-28-mary-rose
  title: Mary Rose
  subtitle: Tudor warship, 1:400
  date: 2024
  description: Henry VIII's warship, launched in 1511, sunk in the Solent in 1545 and raised in 1982, here under full sail on a sculpted sea.
  crop: 50% 40%
  specs:
    Scale: "1:400"
    Kit: Airfix

- file: 2024-08-20-mary-rose-workbench
  title: Mary Rose, Finished
  subtitle: Tudor warship, 1:400
  date: 2024
  specs:
    Scale: "1:400"
    Kit: Airfix

- file: 2026-03-05-uss-gerald-r-ford
  video: true
  title: USS Gerald R. Ford
  subtitle: Aircraft carrier, 1:700, with lights
  date: 2026
  description: The lead ship of the U.S. Navy's newest class of carriers (CVN&#8209;78), with a full air wing on deck.
  specs:
    Scale: "1:700"
    Kit: Magic Factory

- file: 2026-03-21-yamato-tricon
  title: Yamato
  subtitle: Battleship, 1:700
  date: 2026
  description: The largest battleship ever built. Shown at TRICON 2026, the IPMS Three Rivers model show in Pittsburgh, where it won Best Ship and a Judge's Award.
  crop: 50% 35%
  specs:
    Scale: "1:700"
    Shown at: TRICON 2026, Pittsburgh
    Awards: Best Ship, Judge's Award
