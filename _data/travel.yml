# The Travel page (_pages/travel.md), oldest first: the grid shows the entries in this
# order, and its "Newest first" button flips it. travel/#photo-3 opens the third entry.
#
#   file         name of the files in images/travel/ (made by scripts/gallery_images.py
#                from the original in photography/; see README.md for videos)
#   video        true for a clip: images/travel/<file>.mp4, with <file>.jpg as its poster
#   title        shown on hover and in the full view
#   subtitle     where it was taken
#   date         shown after the subtitle
#   description  optional, shown in the full view
#   feature      true for a large tile, two cells wide and two tall, best one landscape
#                photo a year; otherwise a photo gets one cell (3:2), or two tall for a
#                portrait, or two wide for a panorama (from _data/photo_sizes.yml)
#   crop         optional: which part stays in view where its tile crops the photo, as
#                "x% y%" (default "50% 50%", the middle)
#
# No camera settings here, please: the page is about the places, not the photography.

